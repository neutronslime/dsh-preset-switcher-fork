description:
  en: 'Switch the current session''s agent preset (mode) at any time, including after the conversation has started: a session-header dropdown backed by a fenced /preset-switch/api route that also repairs sessions whose recorded preset was deleted. Fork of jeffcwj/dsh-preset-switcher updated for DSH 0.2.1.'
